name: Publish Eval Ledger 2026-07-27

on:
  push:
    branches: ["master"]
    paths: [".github/workflows/publish-ledger-2026-07-27.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Prepend daily ledger entry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('site/assets/data.js')
          raw = path.read_text(encoding='utf-8').strip()
          prefix = 'window.MODERNIZEBENCH_DATA='
          if not raw.startswith(prefix):
              raise SystemExit('Unexpected data.js prefix')
          payload = raw[len(prefix):]
          if payload.endswith(';'):
              payload = payload[:-1]
          data = json.loads(payload)
          before_project = json.dumps(data.get('project'), sort_keys=True, ensure_ascii=False)
          entry = {
            "id": "evidence-supported-score-bounds-2026-07-27",
            "date": "2026-07-27",
            "label": "Evaluation method",
            "category": "research",
            "relevance": "HIGH",
            "material": True,
            "affected": "Outcome graders, evidence retention, score reporting, and benchmark validity",
            "title": "When the evidence cannot prove success, report an uncertainty bound—not a forced verdict",
            "summary": "A May 11 study introduced an outcome-evidence layer for interactive-agent benchmarks. Before scoring, it specifies the artifacts required to verify each claimed outcome, applies a locked checklist, and labels every run Evidence Pass, Evidence Fail, or Unknown. It then reports score bounds rather than hiding Unknown cases inside one aggregate success rate. Across five public benchmarks, the method separated genuine task failure from missing, ambiguous, or insufficient outcome evidence.",
            "impact": "ModernizeBench will grade migrations through API responses, database state, UI behavior, audit records, traces, files, and other artifacts. A grader can be unable to prove the intended business outcome even when the agent may have succeeded—for example, when the retained trace shows a Save action but not which customer record changed. Forcing these cases into pass or fail corrupts benchmark comparisons and can reward workflows that leave less auditable evidence. Evidence sufficiency must therefore be evaluated separately from task correctness.",
            "action": "Add an Evidence Contract to every deterministic and model-based grader. Declare the exact artifacts and fields needed to verify the claim, validate artifact completeness before applying the outcome assertion, and return one of VERIFIED_PASS, VERIFIED_FAIL, or UNKNOWN_EVIDENCE. Publish lower and upper score bounds: the lower bound counts Unknown as failure, while the upper bound counts Unknown as possible success. Track unknown rate by Task Pack, workflow, runner, and grader version; block public comparisons when it exceeds a declared threshold. Treat missing evidence as an observability defect, not silently as agent failure.",
            "exercise": "Choose one Task Pack involving an authorization-sensitive database update. Define an evidence contract requiring the target entity ID, before and after row values, authenticated role, API response, audit event, and trace correlation ID. Create three synthetic runs: verified correct update, verified wrong-record update, and an update with incomplete retained evidence. Implement a tri-state grader and report the benchmark's lower bound, upper bound, and Unknown rate. Then add a CI rule that rejects score publication when Unknown exceeds 5%.",
            "urgency": "Build into the grader contract before publishing benchmark scores",
            "source": "Gao and Zhou — Evidence-Supported Bounds for Interactive-Agent Evaluation",
            "url": "https://arxiv.org/abs/2605.10448"
          }
          ids = {item.get('id') for item in data.get('newsletter', [])}
          if entry['id'] not in ids:
              data['newsletter'].insert(0, entry)
          after_project = json.dumps(data.get('project'), sort_keys=True, ensure_ascii=False)
          if before_project != after_project:
              raise SystemExit('Project object changed')
          path.write_text(prefix + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + ';\n', encoding='utf-8')
          PY
          node --check site/assets/data.js
          grep -q 'assets/data.js' site/ledger/index.html
          grep -q 'assets/learning-1.js' site/ledger/index.html
      - name: Commit publication
        run: |
          if git diff --quiet -- site/assets/data.js; then
            echo "Entry already present"
            exit 0
          fi
          git config user.name "modernizebench-bot"
          git config user.email "modernizebench-bot@users.noreply.github.com"
          git add site/assets/data.js
          git commit -m "Publish Eval Ledger: 2026-07-27"
          git push origin master
